name: Go

on:
  push:
  pull_request:

jobs:

  # Full testing on Ubuntu with all build tags and pool combinations
  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pool:
          - ''           # default (WeakPool on Go 1.24)
          - 'clone'
          - 'unsafe'
        build_tags:
          - ''
          - 'noquotas'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: All tests
      env:
        GOLUA_POOL: ${{ matrix.pool }}
      run: go test -tags "${{ matrix.build_tags }}" -coverprofile="coverage.txt" -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
      with:
        files: ./coverage.txt
        name: codecov-ubuntu-${{ matrix.pool || 'default' }}-${{ matrix.build_tags || 'notags' }}
        verbose: true

    - name: Build CLI
      run: go build -tags "${{ matrix.build_tags }}"

    - name: Check out Lua Test Suite 5.5
      uses: actions/checkout@v4
      with:
        repository: arnodel/golua-tests
        ref: golua-5.5
        path: ./lua-test-suite

    - name: Run Lua Test Suite
      env:
        GOLUA_POOL: ${{ matrix.pool }}
      run: ../golua -u -e "_U=true" -e "_port=true" all.lua
      working-directory: ./lua-test-suite

  # Backward compatibility test with older Go (WeakPool excluded by build tag)
  test-compat:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: All tests
      run: go test -coverprofile="coverage.txt" -covermode=atomic ./...

    - name: Build CLI
      run: go build

  # Forward compatibility test with the latest Go release. Catches breakage from
  # tightened linker rules around //go:linkname (see issue #128).
  test-latest:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: All tests
      run: go test ./...

    - name: Build CLI (default linker checks)
      run: go build

  # Testing on macOS and Windows with default pool and no build tags
  test-other:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - macOS-latest
          - windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: All tests
      run: go test -coverprofile="coverage.txt" -covermode=atomic ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
      with:
        files: ./coverage.txt
        name: codecov-${{ matrix.os }}
        verbose: true

    - name: Build CLI
      run: go build

    - name: Check out Lua Test Suite 5.5
      uses: actions/checkout@v4
      with:
        repository: arnodel/golua-tests
        ref: golua-5.5
        path: ./lua-test-suite

    - name: Run Lua Test Suite
      run: ../golua -u -e "_U=true" -e "_port=true" all.lua
      working-directory: ./lua-test-suite
